name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # pywin32==306 ships no wheels for 3.13, so 3.12 is the ceiling here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build portable executable
        run: pyinstaller portable_exe.spec --clean --noconfirm

      - name: Stage runtime files
        run: |
          copy logo.png dist\
          if (Test-Path .env.example) { copy .env.example dist\ }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: EduPrinterSystem-windows-x64
          path: dist/
          if-no-files-found: error
