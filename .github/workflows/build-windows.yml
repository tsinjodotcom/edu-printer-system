name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # pywin32==306 ships no wheels for 3.13, so 3.12 is the ceiling here.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build portable executable
        run: pyinstaller portable_exe.spec --clean --noconfirm

      # Boots the real exe on real Windows. Catches import-time failures
      # (missing bundled modules) that a successful PyInstaller run hides.
      - name: Smoke test executable
        run: |
          $p = Start-Process -FilePath dist\EduPrinterSystem.exe -PassThru `
                 -RedirectStandardOutput out.log -RedirectStandardError err.log
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:5050/ -UseBasicParsing -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "--- stdout ---"; Get-Content out.log -ErrorAction SilentlyContinue
          Write-Host "--- stderr ---"; Get-Content err.log -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Executable did not serve GET / on port 5050" }
          Write-Host "Smoke test passed: health endpoint returned 200"

      - name: Stage runtime files
        run: |
          copy logo.png dist\
          if (Test-Path .env.example) { copy .env.example dist\ }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: EduPrinterSystem-windows-x64
          path: dist/
          if-no-files-found: error
